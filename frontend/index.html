<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <title>数智分析 | SIDA</title>

    <!-- PWA -->
    <link rel="manifest" href="/manifest.json" />
    <meta name="theme-color" content="#4f46e5" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="数智分析" />
    <link rel="apple-touch-icon" href="/icon-192.png" />

    <!-- Meta -->
    <meta name="description" content="AI 驱动的股票监控助手，实时行情、智能分析、异动提醒" />
    <meta name="mobile-web-app-capable" content="yes" />

    <!--
      修复(S-1, 2026-08-23) — JWT 仍存 localStorage, 加严格 CSP meta 缓解 XSS→token 抽取:
      - default-src 'self'                  : 只允许同源资源
      - script-src 'self' + 两 CDN(白名单) + 内联 bootstrap 入口
      - style-src 'self' 'unsafe-inline'    : Tailwind/inline style 仍需 unsafe-inline (tradoff)
      - connect-src 'self' + 4 个数据/WP源  : 后端代理/WS 通过 self, 业务域名单列
      - img-src 'self' data:                : 头像 data: URL 兼容
      - frame-src 'self' blob:              : 影子账户报告 iframe sandbox 渲染(S-2)
      - object-src 'none' / base-uri 'self' / form-action 'self'
      TODO(后续迁移, 不在本次范围): 同步把 token 迁到 HttpOnly+Secure+SameSite=Lax cookie,
           后端 server.py 改 /auth/login 设 cookie + 删 localStorage 写入, refresh token 旋转机制.
    -->
    <meta http-equiv="Content-Security-Policy" content="
      default-src 'self';
      script-src 'self' 'unsafe-inline' https://unpkg.com https://cdn.jsdelivr.net;
      style-src 'self' 'unsafe-inline';
      img-src 'self' data: blob: https:;
      font-src 'self' data: https://unpkg.com https://cdn.jsdelivr.net;
      connect-src 'self' ws: wss: http://127.0.0.1:8000 http://localhost:8000 https://stock.quicktiny.cn https://np-cnotice-stock.eastmoney.com https://push2.eastmoney.com https://push2delay.eastmoney.com https://push2ex.eastmoney.com https://qt.gtimg.cn;
      worker-src 'self' blob:;
      frame-src 'self' blob:;
      object-src 'none';
      base-uri 'self';
      form-action 'self';
    " />
    <meta http-equiv="X-Content-Type-Options" content="nosniff" />
    <meta http-equiv="Referrer-Policy" content="strict-origin-when-cross-origin" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <script>
      // 注册 Service Worker
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('/sw.js')
            .then((reg) => console.log('SW registered:', reg.scope))
            .catch((err) => console.log('SW registration failed:', err));
        });
      }
    </script>
  </body>
</html>
